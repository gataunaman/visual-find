name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          path-type: inherit
      - name: Add MinGW to PATH
        shell: pwsh
        run: echo "C:\msys64\mingw64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Build and test
        shell: pwsh
        run: ./build.ps1 -Test -Package
      - uses: actions/upload-artifact@v4
        with:
          name: VisualFind-win-x64
          path: dist/VisualFind-1.0.0-win-x64.zip
